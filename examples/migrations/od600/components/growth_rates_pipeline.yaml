    method: fit_max_growth_rate_per_series
    parameters:
      df: df_transformed
      time_col: time_h
      value_col: log_od_od0
      group_cols:
      - group_id
      moving_window_size: '{moving_window_size}'
      smoothing_iterations: '{smoothing_iterations}'
      smooth_window_size: '{smooth_window_size}'
  - name: df_combined_fit
    package: labUtils.utils
    method: smart_join_drop_right
    parameters:
      left_df: df_fit_max_growth_rate
      right_df: df_fit_modified_gompertz
      on_cols:
      - group_id
  - name: df_predict_modified_gompertz
    package: labUtils.growth_rates
    method: predict_modified_gompertz_per_series
    parameters:
      df: df_transformed
      params_df: df_combined_fit
      time_col: time_h
      value_col: log_od_od0
      standard_deviation_column: '{od600_col}_std'
      group_cols:
      - group_id
      save_plot_data: '{save_plot_data}'
  - name: save_df_parsed
    package: app.runner.files
    method: write_csv
    parameters:
      value: df_parsed
      filename: parsed_data.csv
  - name: save_df_report
    package: app.runner.files
    method: write_csv
    parameters:
      value: df_report
      filename: report.csv
  - name: save_df_combined_fit
    package: app.runner.files
    method: write_csv
    parameters:
      value: df_combined_fit
      filename: growth_rates.csv
  - name: save_df_predict_modified_gompertz
    package: app.runner.files
    method: write_csv
    parameters:
      value: df_predict_modified_gompertz
      filename: predictions.csv
