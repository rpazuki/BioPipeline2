# A component library: reusable named graphs of Python calls.
#
# This is the shape the project already uses -- a `pipelines:` list of
# single-key named graphs, each with a `Processes:` block -- so existing
# libraries load without rewriting. The loader also accepts a plain `graphs:`
# mapping.
#
# A component has no publication, schedule or run of its own. The compiler
# expands it into the pipeline's IR and pins it by digest, so a change here
# cannot alter a revision that already exists.
pipelines:
  - growth_rate_fit_pipeline:
      Processes:
        - df_parsed:
            package: labUtils.media_bot
            method: parse
            parameters:
              value_column_name: od600
        - df_transformed:
            package: labUtils.growth_rates
            method: transform_to_log_n_n0
            parameters:
              value_col: od600
              transformed_col: log_od_od0
              OD_0_averaging_window: 4
        - df_fit_max_growth_rate:
            package: labUtils.growth_rates
            method: fit_max_growth_rate
            parameters:
              time_col: time_h
              value_col: log_od_od0
              moving_window_size: 5
              smoothing_iterations: 4

  - growth_rate_replicates_fit_pipeline:
      Processes:
        - df_parsed:
            package: labUtils.media_bot
            method: parse
            parameters:
              value_column_name: od600
        - df_replicate_stats:
            package: labUtils.media_bot
            method: replicate_stats
            parameters:
              ddof: 0
        - df_fit_max_growth_rate:
            package: labUtils.growth_rates
            method: fit_max_growth_rate
            parameters:
              time_col: time_h
              value_col: log_od_od0
              moving_window_size: 5
