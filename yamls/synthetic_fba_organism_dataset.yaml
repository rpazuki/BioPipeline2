pipelines:
  - synthetic_fba_dataset_generation_pipeline:
      Inputs:
        []
      Processes:
        - organisim_file:
              package: pipeline.helpers
              method: download_file_to
              parameters:
                  # iML1515 is the default, change it in the job definition
                  url: "http://bigg.ucsd.edu/static/models/iML1515.xml"
                  # Make sure to change the to_path in the job
                  to_path: EMPTY
        - generate_dataset:
            package: labUtils.synthetic
            method: generate_organism_dataset
            parameters:
              organism_sbml_path: organisim_file
              supplement_to_exchange_map: null
              output_dir: null
              enumeration: null
              phenotype: null
              kinetics_defaults: null
        - write_dataset:
            package: labUtils.synthetic
            method: write_dataset
            parameters:
              dataset: generate_dataset
              out_dir: EMPTY

      Outputs:
        []
