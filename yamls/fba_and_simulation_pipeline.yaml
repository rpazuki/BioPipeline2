pipelines:
    - FBA_build_and_simulate_pipeline:
        Inputs:
            #####################################
            # grothwth measurment csv
            - growth_data:
                - src: EMPTY
                - package:  labUtils.utils
                - method: read_csv
            # SBML model file
            - model_sbml:
                - src: EMPTY
                - package:  labUtils.amn_mappings
                - method: parse_sbml_exchanges
                - is_cached: true
             # SBML model file
            - model_sbml_bounds:
                - src: EMPTY
                - package:  labUtils.amn_mappings
                - method: parse_sbml_exchange_bounds
                - is_cached: true
        Processes:
            - mapping_df:
                package: labUtils.amn_mappings
                method: build_mappings
                parameters:
                    growth_rates_df: growth_data # The 'growth_data' input defined above
                    supplement_to_exchange_map: model_sbml # The 'model_sbml' input defined above
                    supplement_column: supplements # The column name for OD values in output dataframe
                    halt_on_error: false
                    custom_mapping_file: custom_exchange_mapping.yaml
                    verbose: true
            - df_flux:
                package: labUtils.amn_mappings
                method: build_supplement_flux_dataframe
                parameters:
                    growth_rates_df: growth_data # The 'growth_data' input defined above
                    mappings_df : mapping_df
            - cobra_model:
                package: cobra.io
                method: read_sbml_model
                parameters: 
                    filename: EMPTY
            - df_simulation:
                package: labUtils.fba.fba_tools
                method: solve_fba_and_flux
                parameters:
                    df: df_flux
                    model: cobra_model
                    gr_column: mv_mu_max
                    use_sfba: False
                    solution_column_name: fba_growth
                    solution_status_column_name: fba_status

        Outputs:
            #####################################
            # List of output dataframes to save
            # to csv files
            - mapping_df: mappings.csv
            - df_flux: df_flux.csv
            - df_simulation: [fba_simulation.csv, fba_flux_simulation.csv]
     

