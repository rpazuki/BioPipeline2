# Development stack. Production compose lives beside this file once the
# execution adapter exists; do not reuse these credentials anywhere real.
name: biopipeline2-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biopipeline
      POSTGRES_PASSWORD: biopipeline
      POSTGRES_DB: biopipeline2
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biopipeline -d biopipeline2"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
